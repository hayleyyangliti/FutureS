  const personalPromptKey='futures-content-engine:personal-skill-prompts';const promptOverrides=()=>{try{return JSON.parse(localStorage.getItem(personalPromptKey)||'{}')}catch(e){return{}}};const managedPrompt=name=>promptOverrides()[name]||importedPromptDefinitions[name]?.content||'当前模块沿用工作台现行生产规范。';
  const promptModal=document.createElement('dialog');promptModal.className='skill-prompt-modal';promptModal.innerHTML='<div class="modal-head"><h3 id="skillPromptTitle">Prompt 设置</h3><button class="modal-close" id="closeSkillPrompt">×</button></div><div class="skill-prompt-body"><p class="prompt-source-note"><b>开发者初始 Prompt</b>按内容分类与具体场景分别配置。保存后仅覆盖当前使用者的个性化设定。</p><textarea id="skillPromptText" aria-label="生产 Prompt"></textarea></div><div class="skill-prompt-foot"><span>修改会在下一次 AI Studio 内容生产时生效。</span><div><button class="btn outline" id="resetSkillPrompt">恢复初始设定</button><button class="btn primary" id="saveSkillPrompt">保存设定</button></div></div>';document.body.appendChild(promptModal);let editingSkillName='';
  function renderPromptService(){const grid=document.getElementById('promptGrid');if(!grid)return;const overrides=promptOverrides();grid.innerHTML=Object.entries(importedPromptDefinitions).map(([name,definition])=>`<article class="skill-card" data-prompt-name="${name}" style="cursor:pointer"><div class="skill-card-top"><span class="skill-icon">P</span><span class="state-pill ${overrides[name]?'':'off'}">${overrides[name]?'个人已调整':'初始设定'}</span></div><h3>${definition.category} · ${definition.scene} Prompt</h3><p>${definition.category} / ${definition.scene} 的开发者初始生产规则，可查看、编辑或恢复初始设定。</p><div class="skill-meta"><span>${overrides[name]?'已保存个人版本':'开发者初始版本'}</span><span>查看 / 编辑</span></div></article>`).join('');grid.querySelectorAll('[data-prompt-name]').forEach(card=>card.onclick=()=>{editingSkillName=card.dataset.promptName;document.getElementById('skillPromptTitle').textContent=`「${editingSkillName}」Prompt 设置`;document.getElementById('skillPromptText').value=managedPrompt(editingSkillName);promptModal.showModal()})}renderPromptService();loadImportedPromptDefinitions();
  document.getElementById('closeSkillPrompt').onclick=()=>promptModal.close();document.getElementById('saveSkillPrompt').onclick=()=>{const value=document.getElementById('skillPromptText').value.trim();if(!value){toast('Prompt 不能为空');return}const all=promptOverrides();all[editingSkillName]=value;localStorage.setItem(personalPromptKey,JSON.stringify(all));promptModal.close();renderPromptService();toast('个人 Prompt 已保存')};document.getElementById('resetSkillPrompt').onclick=()=>{const all=promptOverrides();delete all[editingSkillName];localStorage.setItem(personalPromptKey,JSON.stringify(all));document.getElementById('skillPromptText').value=importedPromptDefinitions[editingSkillName]?.content||'';renderPromptService();toast('已恢复开发者初始设定')};
  document.querySelectorAll('.switch:not(:disabled)').forEach(btn=>btn.onclick=()=>{btn.classList.toggle('on');const row=btn.closest('.admin-row'),state=row?.querySelector('.state-pill');if(state){state.textContent=btn.classList.contains('on')?(state.textContent.includes('连接')?'已连接':'已启用'):'已停用';state.classList.toggle('off',!btn.classList.contains('on'))}toast(btn.classList.contains('on')?'服务已启用':'服务已停用')});

  function renderContentRequests(){const pane=document.getElementById('admin-content-requests'),developer=currentAccount?.role==='developer';if(!pane)return;const tab=document.querySelector('.content-request-tab');if(tab)tab.hidden=!developer;if(!developer){pane.innerHTML='';return}const pending=shareRequests.filter(item=>item.status==='pending');pane.innerHTML=`<div class="admin-pane-head"><div><h2>百宝箱内容申请</h2><p>普通使用者从个人知识库提交的内容在此集中审核。</p></div><span class="state-pill ${pending.length?'':'off'}">${pending.length} 条待处理</span></div><div class="admin-list">${shareRequests.length?shareRequests.map(item=>`<div class="admin-row"><span><b>${escapeHtml(item.title)}</b><small>${escapeHtml(item.requesterName)} · 工号 ${item.requesterId} · ${item.time}</small></span><span class="role-badge">${escapeHtml(item.folder||'未归档')}</span><small>${item.status==='pending'?'待审核':item.status==='approved'?'已通过':'未通过'}</small><span class="member-actions">${item.status==='pending'?`<button data-share-review="approve" data-request-id="${item.id}">通过</button><button data-share-review="reject" data-request-id="${item.id}">不通过</button>`:'<small>已处理</small>'}</span></div>`).join(''):'<div class="coming-note">暂无百宝箱内容上传申请。</div>'}</div>`;pane.querySelectorAll('[data-share-review]').forEach(button=>button.onclick=()=>{const request=shareRequests.find(item=>String(item.id)===button.dataset.requestId);if(!request)return;const approved=button.dataset.shareReview==='approve';request.status=approved?'approved':'rejected';request.feedback=approved?'已通过，内容已同步至百宝箱':'开发者未通过本次申请';if(approved){const record=caseRecords.find(item=>item.id===request.recordId);if(record&&!caseRecords.some(item=>item.library==='shared'&&item.sharedFrom===record.id))caseRecords.unshift({...record,id:Date.now(),library:'shared',folder:request.targetFolder||record.folder,sharedFrom:record.id,time:new Date().toLocaleString('zh-CN',{hour12:false})})}saveShareRequests();renderContentRequests();renderAccountAdmin();if(activeLibrary==='shared')renderCases();toast(approved?'申请已通过，内容已同步至百宝箱':'申请已标记为不通过')})}
  function renderAccountAdmin(){const pane=document.getElementById('admin-permissions');if(!pane)return;const developer=currentAccount?.role==='developer';if(!developer){const mine=shareRequests.filter(item=>item.requesterId===currentAccount?.id);pane.innerHTML=`<div class="admin-pane-head"><div><h2>账号权限</h2><p>普通使用者可查看个人百宝箱内容上传申请；Agent 状态、Skill 和 API 接口仍可正常查看。</p></div></div><div class="permission-request-card"><div><span class="skill-icon">宝</span></div><div><h3>申请上传至百宝箱</h3><p>请在“个人知识库”选择具体内容并点击“申请共享”。开发者审核通过后，内容将同步至百宝箱。</p><span class="state-pill ${mine.some(item=>item.status==='pending')?'':'off'}">${mine.some(item=>item.status==='pending')?'有申请待审核':'暂无待审核申请'}</span></div></div><div class="admin-list" style="margin-top:14px">${mine.length?mine.map(item=>`<div class="admin-row"><span><b>${escapeHtml(item.title)}</b><small>提交时间：${item.time}</small></span><span class="state-pill ${item.status==='rejected'?'off':''}">${item.status==='pending'?'等待审核':item.status==='approved'?'已通过':'未通过'}</span><small>${item.feedback||'等待开发者处理'}</small><span></span></div>`).join(''):'<div class="coming-note">暂无提交记录。请前往个人知识库选择案例后提交。</div>'}</div>`;return}pane.innerHTML=`<div class="admin-pane-head"><div><h2>账号权限</h2><p>仅开发者可维护项目账号及开发者角色。</p></div><div><button class="outline-btn" id="downloadAccountTemplate">下载 Excel 导入模板</button> <button class="outline-btn" id="importAccountsBtn">导入账号</button> <button class="primary-btn" id="addAccountBtn">＋ 新增账号</button><input class="account-import" id="accountImportInput" type="file" accept=".xlsx,.xls,.csv"></div></div><div class="account-toolbar"><span class="state-pill">${accounts.length} 个账号</span><small>固定开发者：yangliti（130118）、wangyu13（130117）</small></div><table class="account-table"><thead><tr><th>姓名</th><th>邮箱前缀</th><th>工号</th><th>角色</th><th></th></tr></thead><tbody>${accounts.map(account=>`<tr><td>${escapeHtml(account.chineseName||'—')}</td><td>${escapeHtml(account.name)}</td><td>${account.id}</td><td><span class="role-badge ${account.role==='developer'?'dev':''}">${account.role==='developer'?'开发者':'普通使用者'}</span></td><td>${protectedDeveloperIds.has(account.id)?'<small>固定开发者</small>':`<button class="outline-btn" data-grant-developer="${account.id}">${account.role==='developer'?'撤销开发者':'设为开发者'}</button> <button class="outline-btn" data-remove-account="${account.id}">删除</button>`}</td></tr>`).join('')}</tbody></table>`;document.getElementById('downloadAccountTemplate').onclick=downloadAccountTemplate;document.getElementById('addAccountBtn').onclick=()=>{const chineseName=prompt('姓名')?.trim(),name=prompt('邮箱前缀')?.trim(),id=prompt('工号')?.trim(),grant=confirm('是否授予开发者权限？');if(!chineseName||!name||!id)return;if(!/^\d+$/.test(id)){toast('工号必须为数字');return}if(accounts.some(item=>item.id===id)){toast('该工号已存在');return}accounts.push({chineseName,name,id,role:grant?'developer':'user'});saveAccounts();renderAccountAdmin();toast('账号已新增，请在账号管理服务中完成开通')};document.getElementById('importAccountsBtn').onclick=()=>document.getElementById('accountImportInput').click();document.getElementById('accountImportInput').onchange=event=>{const file=event.target.files[0];if(file)toast(`已接收“${file.name}”。请按 Excel 模板的“姓名、邮箱前缀、工号、部门”表头导入。`)};pane.querySelectorAll('[data-grant-developer]').forEach(button=>button.onclick=()=>{const account=accounts.find(item=>item.id===button.dataset.grantDeveloper);if(!account)return;account.role=account.role==='developer'?'user':'developer';saveAccounts();renderAccountAdmin();toast(account.role==='developer'?'已授予开发者权限':'已撤销开发者权限')});pane.querySelectorAll('[data-remove-account]').forEach(button=>button.onclick=()=>{const account=accounts.find(item=>item.id===button.dataset.removeAccount);if(account&&confirm(`确认删除“${account.name}”账号？`)){accounts=accounts.filter(item=>item!==account);saveAccounts();renderAccountAdmin();toast('账号已删除')}})}
  function applyAdminRole(){const tabs=document.querySelector('.admin-tabs');if(!tabs)return;tabs.style.display='flex';renderAccountAdmin();renderContentRequests()}
  function updateLoginUi(){const user=document.querySelector('.nav-user'),name=user.querySelector('span'),avatar=user.querySelector('.avatar');if(!currentAccount){name.textContent='未登录';avatar.textContent='登录';document.body.dataset.userRole='guest';user.querySelector('.user-menu')?.remove();user.onclick=openLogin;applyAdminRole();return}name.textContent=currentAccount.chineseName||currentAccount.name;avatar.textContent=initials(currentAccount.chineseName||currentAccount.name);document.body.dataset.userRole=currentAccount.role;if(currentAccount.role==='viewer'){name.textContent+=' · 只读';document.querySelectorAll('.studio-layout [contenteditable]').forEach(e=>e.setAttribute('contenteditable','false'));}let menu=user.querySelector('.user-menu');if(!menu){menu=document.createElement('div');menu.className='user-menu';user.append(menu)}menu.innerHTML='<button data-user-action="password">修改密码</button><button data-user-action="logout">退出登录</button>';menu.querySelector('[data-user-action="password"]').onclick=()=>{menu.classList.remove('show');passwordModal.showModal()};menu.querySelector('[data-user-action="logout"]').onclick=()=>{localStorage.removeItem(sessionStoreKey);localStorage.removeItem('futures-content-engine:access-token');currentAccount=null;updateLoginUi();toast('已退出登录')};user.onclick=()=>{if(currentAccount)menu.classList.toggle('show')};applyAdminRole()}
  document.addEventListener('click',event=>{if(document.body.dataset.userRole!=='viewer')return;const button=event.target.closest('button,[role="button"]');if(button&&/新增|创建|删除|编辑|保存|生成|上传|导入|发布|审批|申请|归档|移动|定稿/.test(button.textContent)){event.preventDefault();event.stopImmediatePropagation();toast('当前账号为只读查看权限')}},true);
  async function restoreAuthenticatedAccount(){const token=localStorage.getItem('futures-content-engine:access-token');if(!token)return;try{const response=await fetch('/api/me',{headers:{Authorization:`Bearer ${token}`}}),data=await response.json();if(!response.ok)return;const p=data.profile;currentAccount={id:p.employee_no,chineseName:p.display_name,name:p.email_prefix,role:p.role||'user'};updateLoginUi();}catch(_){}}
  setTimeout(()=>void restoreAuthenticatedAccount(),0);
  const openLogin=()=>{document.getElementById('loginError').textContent='';document.getElementById('loginId').value='';document.getElementById('loginPassword').value='';loginModal.showModal();setTimeout(()=>document.getElementById('loginId').focus(),0)};
  document.getElementById('confirmLogin').onclick=async()=>{const email=document.getElementById('loginId').value.trim().toLowerCase(),password=document.getElementById('loginPassword').value,error=document.getElementById('loginError'),button=document.getElementById('confirmLogin');error.textContent='';if(!/^[^\s@]+@gtht\.com$/.test(email)||!password){error.textContent='请输入完整的 @gtht.com 邮箱和密码。';return}button.disabled=true;button.textContent='登录中…';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}),data=await response.json();if(!response.ok)throw new Error(data.error||'INVALID_CREDENTIALS');localStorage.setItem('futures-content-engine:access-token',data.accessToken);currentAccount={id:data.profile.employee_no,chineseName:data.profile.display_name,name:data.profile.email_prefix,role:data.profile.role||'user'};loginModal.close();document.getElementById('loginPassword').value='';updateLoginUi();toast(`欢迎登录，${currentAccount.chineseName||currentAccount.name}`)}catch(e){error.textContent=e.message==='SUPABASE_KEY_REJECTED'?'登录服务暂不可用，请联系开发者。':e.message==='PROFILE_NOT_FOUND'?'账号资料尚未配置，请联系开发者。':'邮箱或密码错误，或登录服务暂不可用，请重试。'}finally{button.disabled=false;button.textContent='登录'}};
  loginModal.querySelector('form').addEventListener('submit',event=>{event.preventDefault();document.getElementById('confirmLogin').click()});
  document.getElementById('closePasswordModal').onclick=()=>passwordModal.close();document.getElementById('savePassword').onclick=()=>{const old=document.getElementById('oldPassword').value,next=document.getElementById('newPassword').value,confirmPassword=document.getElementById('confirmPassword').value,error=document.getElementById('passwordError');if(old!==currentAccount.password){error.textContent='原密码不正确。';return}if(next.length<6){error.textContent='新密码至少为 6 位。';return}if(next!==confirmPassword){error.textContent='两次输入的新密码不一致。';return}currentAccount.password=next;saveAccounts();passwordModal.close();toast('密码已修改，当前登录状态保持不变')};
  try{const sessionId=localStorage.getItem(sessionStoreKey);currentAccount=accounts.find(account=>account.id===sessionId)||null}catch(e){}
  caseTableBody.addEventListener('click',event=>{const button=event.target.closest('[data-case-action="share"]');if(!button)return;const record=caseRecords.find(item=>item.id===Number(button.closest('tr').dataset.caseId));if(!record)return;if(!currentAccount){openLogin();return}if(shareRequests.some(item=>item.recordId===record.id&&item.requesterId===currentAccount.id&&item.status==='pending')){toast('该内容已提交申请，请等待开发者审核');return}shareRequests.unshift({id:Date.now(),recordId:record.id,requesterId:currentAccount.id,requesterName:currentAccount.chineseName||currentAccount.name,title:record.title,folder:record.folder,status:'pending',feedback:'',time:new Date().toLocaleString('zh-CN',{hour12:false})});saveShareRequests();toast('已提交至百宝箱审核列表')});
  document.addEventListener('click',event=>{if(currentAccount)return;const link=event.target.closest('.page-link');if(link&&link.dataset.target!=='page-market'){event.preventDefault();event.stopImmediatePropagation();openLogin()}},true);
  document.querySelector('[data-target="page-admin"]')?.addEventListener('click',()=>setTimeout(applyAdminRole,0));
  updateLoginUi();
  renderFolderList();refreshFolderSelect();renderCases();updateMonitorCaseSelect();
</script>
